name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build RuhTree APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compile Kotlin and save full log
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all 2>&1 | tee kotlin-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RuhTree-build-log
          path: kotlin-build.log
          if-no-files-found: warn

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ RuhTree Android build failed."
          echo "Download the RuhTree-build-log artifact to see the complete compiler error."
          exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RuhTree-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
